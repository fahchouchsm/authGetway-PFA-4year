services:  maven-db:    image: mysql:8.0    environment:      MYSQL_ROOT_PASSWORD: admin      MYSQL_DATABASE: authgetway      MYSQL_USER: auth      MYSQL_PASSWORD: auth    ports:      - "3310:3306"    volumes:      - mysql_data:/var/lib/mysql    healthcheck:      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]      interval: 5s      timeout: 5s      retries: 10  redis:    image: redis:7-alpine    ports:      - "6379:6379"    healthcheck:      test: ["CMD", "redis-cli", "ping"]      interval: 5s      timeout: 3s      retries: 5  maven-app:    build: .    depends_on:      maven-db:        condition: service_healthy      redis:        condition: service_healthy    environment:      SPRING_DATASOURCE_URL: jdbc:mysql://maven-db:3306/authgetway      SPRING_DATASOURCE_USERNAME: auth      SPRING_DATASOURCE_PASSWORD: auth      SPRING_DATA_REDIS_HOST: redis      SPRING_DATA_REDIS_PORT: 6379    ports:      - "8080:8080"volumes:  mysql_data: