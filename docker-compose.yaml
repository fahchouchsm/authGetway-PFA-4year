services:  auth-db:    image: mysql:8.0    container_name: auth-db    environment:      MYSQL_ROOT_PASSWORD: admin      MYSQL_DATABASE: authgetway      MYSQL_USER: auth      MYSQL_PASSWORD: auth    ports:      - "3310:3306"    volumes:      - mysql_data:/var/lib/mysql    networks:      - microservices-network    healthcheck:      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]      interval: 5s      timeout: 5s      retries: 10  auth-redis:    image: redis:7-alpine    container_name: auth-redis    ports:      - "6379:6379"    networks:      - microservices-network    healthcheck:      test: ["CMD", "redis-cli", "ping"]      interval: 5s      timeout: 3s      retries: 5  auth-gateway:    build: .    container_name: auth-gateway    depends_on:      auth-db:        condition: service_healthy      auth-redis:        condition: service_healthy    environment:      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/authgetway      SPRING_DATASOURCE_USERNAME: auth      SPRING_DATASOURCE_PASSWORD: auth      SPRING_DATA_REDIS_HOST: auth-redis      SPRING_DATA_REDIS_PORT: 6379      SERVER_PORT: 8082      JWT_SECRET: "mySecretKeyForJWTTokenGeneration2024"      JWT_REFRESH_SECRET: "myRefreshSecretKeyForJWTToken2024Refresh"    ports:      - "8082:8082"    networks:      - microservices-networknetworks:  microservices-network:    driver: bridgevolumes:  mysql_data: