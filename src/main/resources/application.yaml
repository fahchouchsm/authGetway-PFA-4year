server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/authgetway}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  springdoc:
    swagger-ui:
      urls:
        - name: jobfinder
          url: /jobs/v3/api-docs
        - name: eventhandler
          url: /events/v3/api-docs
    api-docs:
      enabled: true

  cloud:
    gateway:
      routes:
        - id: jobfinder
          uri: http://jobfinder-service:8081
          predicates:
            - Path=/jobs/**
          filters:
            - StripPrefix=1
        - id: eventhandler
          uri: http://eventhandler-service:8082
          predicates:
            - Path=/events/**
          filters:
            - StripPrefix=1
  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: a2668c001@smtp-brevo.com
    password: sFSYxwj8AEZWO610
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: localhost:3000
  mail:
    from: simofff0@gmail.com
  use-https: false